<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact Notes recorder</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1b2738;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:24px}.panel{max-width:460px;margin:auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 4px 18px #1b273809}h1{font-size:24px;margin:0 0 8px}p{color:#64748b;line-height:1.45}button{font:inherit;border:0;border-radius:9px;padding:12px 16px;background:#e9eef5;color:#20324c;cursor:pointer;margin:5px 5px 5px 0}button.primary{background:#185bd5;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}audio{width:100%;margin:16px 0}.status{min-height:24px;margin-top:12px}.error{color:#b42318}
</style></head><body><main class="panel"><h1>Record voice note</h1><p>Press Start and allow microphone access. Press Stop when finished, listen to it, then choose Use recording. Maximum 8 MB.</p><button id="start" class="primary">● Start</button><button id="stop" disabled>■ Stop</button><button id="send" disabled>Use recording</button><audio id="preview" controls hidden></audio><div id="status" class="status" role="status" aria-live="polite"></div></main>
<script>
const params=new URLSearchParams(location.hash.slice(1));const targetOrigin=params.get('origin');const token=params.get('token');const $=id=>document.getElementById(id);const MAX=8*1024*1024;
let stream,recorder,chunks=[],blob,previewUrl,timer;
function status(message,error=false){$('status').textContent=message;$('status').className='status'+(error?' error':'')}
function tracksOff(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function sendError(message){if(window.opener&&targetOrigin&&token)window.opener.postMessage({app:'contact-notes-recorder',token,type:'error',message},targetOrigin)}
if(!window.opener||!targetOrigin||!/^https:\/\//.test(targetOrigin)||!/^[a-f0-9]{32}$/.test(token)){status('Open this recorder from Contact Notes.',true);$('start').disabled=true}
$('start').onclick=async()=>{
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('This browser does not support microphone recording.');
  if(previewUrl)URL.revokeObjectURL(previewUrl);$('preview').hidden=true;$('send').disabled=true;blob=null;chunks=[];
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported audio format found.');
  recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
   clearInterval(timer);tracksOff();$('start').disabled=false;$('stop').disabled=true;
   blob=new Blob(chunks,{type:mime});
   if(!blob.size||blob.size>MAX){blob=null;status('Recording exceeds 8 MB. Please make a shorter note.',true);return}
   previewUrl=URL.createObjectURL(blob);$('preview').src=previewUrl;$('preview').hidden=false;$('send').disabled=false;status('Listen to your recording, then choose Use recording.');
  };
  recorder.start(1000);$('start').disabled=true;$('stop').disabled=false;status('Recording…');
  timer=setInterval(()=>{const bytes=chunks.reduce((n,c)=>n+c.size,0);if(bytes>MAX&&recorder.state==='recording')recorder.stop()},500);
 }catch(e){tracksOff();$('start').disabled=false;$('stop').disabled=true;status(e.message||'Microphone access was denied.',true);sendError(e.message||'Microphone access was denied.')}
};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
$('send').onclick=()=>{
 if(!blob||!window.opener||window.opener.closed){status('Return to Contact Notes and open the recorder again.',true);return}
 window.opener.postMessage({app:'contact-notes-recorder',token,type:'audio',blob},targetOrigin);
 status('Recording sent. You can return to Contact Notes.');
 setTimeout(()=>window.close(),600);
};
window.addEventListener('pagehide',tracksOff);
</script></body></html>
